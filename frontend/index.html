<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaming vs non-streaming</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #262a33;
      --text: #e6e6e6;
      --muted: #8a8f98;
      --accent: #6ea8fe;
      --user: #2a3142;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; gap: 8px; padding: 12px 16px; }
    textarea {
      flex: 1; resize: none; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit;
    }
    button {
      padding: 0 16px; border: 0; border-radius: 8px; font: inherit; cursor: pointer;
      background: var(--accent); color: #0f1115;
    }
    button.secondary { background: var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: wait; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
    section {
      display: flex; flex-direction: column; height: calc(100vh - 90px);
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    }
    h2 { margin: 0; padding: 12px; font-size: 15px; border-bottom: 1px solid var(--border); }
    .stats { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; }
    .user { background: var(--user); }
    .error { color: var(--error); }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      section { height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <textarea id="input" rows="2" placeholder="Ask something long, e.g. Explain how HTTPS works in 300 words"></textarea>
    <button id="send">Send to both</button>
    <button id="reset" class="secondary">New chat</button>
  </header>

  <main>
    <section>
      <h2>Non-streaming · POST /chat</h2>
      <div class="stats" id="stats-normal">First text: – · Total: – · Tokens: –</div>
      <div class="log" id="log-normal"></div>
    </section>
    <section>
      <h2>Streaming · POST /chat/stream</h2>
      <div class="stats" id="stats-stream">First text: – · Total: – · Tokens: –</div>
      <div class="log" id="log-stream"></div>
    </section>
  </main>

  <script>
    // each panel has its own conversation in the database
    const conversations = { normal: null, stream: null };

    function addMessage(panel, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;  // textContent, never innerHTML: model output can't inject HTML
      const log = document.getElementById("log-" + panel);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function showError(bubble, text) {
      bubble.textContent = text;
      bubble.classList.add("error");
    }

    function showStats(panel, firstMs, totalMs, tokens) {
      document.getElementById("stats-" + panel).textContent =
        `First text: ${firstMs} ms · Total: ${totalMs} ms · Tokens: ${tokens}`;
    }

    async function errorText(res) {
      try { return (await res.json()).detail; } catch { return `HTTP ${res.status}`; }
    }

    function post(url, message, conversationId) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation_id: conversationId }),
      });
    }

    // Non-streaming: nothing to show until the whole reply has arrived
    async function sendNormal(message) {
      addMessage("normal", message, "user");
      const bubble = addMessage("normal", "…waiting for the full reply", "assistant");
      const start = performance.now();
      try {
        const res = await post("/chat", message, conversations.normal);
        if (!res.ok) return showError(bubble, await errorText(res));
        const data = await res.json();
        const ms = Math.round(performance.now() - start);
        bubble.textContent = data.reply;
        conversations.normal = data.conversation_id;
        showStats("normal", ms, ms, data.tokens_used);  // the first text arrives with the last
      } catch (err) {
        showError(bubble, "Network error: " + err.message);
      }
    }

    // Streaming: read the body piece by piece; each line is one JSON event
    async function sendStream(message) {
      addMessage("stream", message, "user");
      const bubble = addMessage("stream", "", "assistant");
      const log = document.getElementById("log-stream");
      const start = performance.now();
      let firstMs = null;
      try {
        const res = await post("/chat/stream", message, conversations.stream);
        if (!res.ok) return showError(bubble, await errorText(res));

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();  // the last piece may be half a line; keep it for the next read

          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "delta") {
              if (firstMs === null) firstMs = Math.round(performance.now() - start);
              bubble.textContent += event.text;
              log.scrollTop = log.scrollHeight;
            } else if (event.type === "done") {
              conversations.stream = event.conversation_id;
              showStats("stream", firstMs, Math.round(performance.now() - start), event.tokens_used);
            } else if (event.type === "error") {
              addMessage("stream", event.detail, "error");
            }
          }
        }
      } catch (err) {
        addMessage("stream", "Network error: " + err.message, "error");
      }
    }

    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      sendButton.disabled = true;
      // same question to both endpoints at the same moment
      await Promise.all([sendNormal(message), sendStream(message)]);
      sendButton.disabled = false;
      input.focus();
    }

    sendButton.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {  // Enter sends, Shift+Enter adds a new line
        e.preventDefault();
        send();
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      conversations.normal = null;
      conversations.stream = null;
      for (const panel of ["normal", "stream"]) {
        document.getElementById("log-" + panel).innerHTML = "";
        document.getElementById("stats-" + panel).textContent = "First text: – · Total: – · Tokens: –";
      }
    });
  </script>
</body>
</html>
