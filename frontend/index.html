<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #262a33;
      --text: #e6e6e6;
      --muted: #8a8f98;
      --accent: #6ea8fe;
      --user: #2a3142;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0;
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
    }
    header { display: flex; gap: 8px; padding: 12px 16px; }
    textarea {
      flex: 1; min-width: 0; resize: none; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit;
    }
    button, select {
      padding: 0 16px; border: 0; border-radius: 8px; font: inherit; cursor: pointer;
      background: var(--accent); color: #0f1115;
    }
    button.secondary, select { background: var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: wait; }
    #attach { padding: 0 14px; font-size: 20px; }
    #doc-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 0 16px 12px; font-size: 13px; color: var(--muted);
    }
    #doc-bar:empty { display: none; }
    #doc-bar span { min-width: 0; overflow-wrap: anywhere; }
    #doc-bar button { padding: 4px 10px; font-size: 13px; }
    #doc-bar select { padding: 4px 8px; font-size: 13px; }
    main { flex: 1; min-height: 0; padding: 0 16px 16px; }
    section {
      display: flex; flex-direction: column; height: 100%;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    }
    h2 { margin: 0; padding: 12px; font-size: 15px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    .stats { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: var(--user); }
    .waiting { color: var(--muted); }
    .error { color: var(--error); }
    details { margin: 0 0 14px; padding: 0 10px; font-size: 13px; color: var(--muted); }
    summary { cursor: pointer; }
    .source { margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--border); line-height: 1.45; overflow-wrap: anywhere; }
    .source strong { display: block; margin-bottom: 4px; color: var(--text); font-weight: 600; }
    @media (max-width: 600px) {
      header { flex-wrap: wrap; }
      textarea { order: -1; flex-basis: 100%; }
      header button { flex: 1; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <button id="attach" class="secondary" title="Upload a PDF" aria-label="Upload a PDF">+</button>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    <textarea id="input" rows="2"></textarea>
    <button id="send">Send</button>
    <button id="reset" class="secondary">New chat</button>
  </header>
  <div id="doc-bar"></div>

  <main>
    <section>
      <h2 id="title"></h2>
      <div class="stats" id="stats"></div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script>
    const DOC_KEY = "attached-document";
    const POLL_MS = 1500;
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const attachButton = document.getElementById("attach");
    const fileInput = document.getElementById("file");
    const docBar = document.getElementById("doc-bar");
    const title = document.getElementById("title");
    const log = document.getElementById("log");
    const stats = document.getElementById("stats");

    let conversationId = null;  // null = the next message starts a new conversation
    let attached = loadAttached();  // {id, filename, page_count, chunks} or null
    let method = "rag";  // "rag" or "prompt"; used only while a document is attached

    // the attached document survives a page refresh, so you don't upload it again
    function loadAttached() {
      try { return JSON.parse(localStorage.getItem(DOC_KEY)); } catch { return null; }
    }

    function saveAttached() {
      try {
        if (attached) localStorage.setItem(DOC_KEY, JSON.stringify(attached));
        else localStorage.removeItem(DOC_KEY);
      } catch { /* the page still works without saving */ }
    }

    function emptyStats() {
      return attached ? "Total: – · Input: – · Output: –" : "First text: – · Total: – · Tokens: –";
    }

    // draw everything that depends on whether a document is attached
    function renderMode() {
      docBar.replaceChildren();
      if (attached) {
        title.textContent = `${attached.filename} · POST /ask/${method}`;
        input.placeholder = "Ask about this document. Each question is answered on its own.";

        const label = document.createElement("span");
        label.textContent = attached.status === "processing"
          ? `${attached.filename} · ${attached.page_count} pages · building chunks…`
          : `${attached.filename} · ${attached.page_count} pages · ${attached.chunks} chunks`;

        const picker = document.createElement("select");
        picker.setAttribute("aria-label", "How to answer");
        picker.add(new Option("RAG: closest chunks", "rag"));
        picker.add(new Option("Prompt: whole document", "prompt"));
        picker.value = method;
        picker.addEventListener("change", () => {
          method = picker.value;
          title.textContent = `${attached.filename} · POST /ask/${method}`;
        });

        const remove = document.createElement("button");
        remove.className = "secondary";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => setAttached(null));

        docBar.append(label, picker, remove);
      } else {
        title.textContent = "Chat · POST /chat/stream";
        input.placeholder = "Ask something, or press + to upload a PDF";
      }
    }

    function setAttached(doc) {
      attached = doc;
      saveAttached();
      renderMode();
      stats.textContent = emptyStats();
    }

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;  // textContent, never innerHTML: model output can't inject HTML
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function showError(bubble, text) {
      bubble.textContent = text;
      bubble.className = "msg error";
    }

    async function errorText(res) {
      try { return (await res.json()).detail; } catch { return `HTTP ${res.status}`; }
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      attachButton.disabled = busy;
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // GET /documents/{id} until the background job has finished
    async function waitUntilReady(id, bubble) {
      while (attached && attached.id === id) {
        await sleep(POLL_MS);
        if (!attached || attached.id !== id) return;
        try {
          const res = await fetch(`/documents/${id}`);
          if (res.status === 404) {
            showError(bubble, "Document not found");
            return setAttached(null);
          }
          if (!res.ok) continue;
          const doc = await res.json();
          if (doc.status === "ready") {
            bubble.className = "msg";
            bubble.textContent = `Ready: ${doc.filename} (${doc.page_count} pages, ${doc.chunks} chunks).`;
            return setAttached(doc);
          }
          if (doc.status === "failed") {
            showError(bubble, doc.error);
            return setAttached(null);
          }
        } catch { /* a network blip: keep checking */ }
      }
    }

    // after a page refresh, find out what happened to the attached document
    async function checkAttached() {
      if (!attached) return;
      const bubble = addMessage(`Checking ${attached.filename}…`, "waiting");
      await waitUntilReady(attached.id, bubble);
      if (bubble.textContent.startsWith("Ready:")) bubble.remove();
    }

    // + button: POST /documents saves the PDF, and its chunks are built in the background
    async function uploadDocument(file) {
      setBusy(true);
      const bubble = addMessage(`Uploading ${file.name}…`, "waiting");
      try {
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/documents", { method: "POST", body: form });
        if (!res.ok) return showError(bubble, await errorText(res));
        const doc = await res.json();
        bubble.textContent = `Building chunks for ${doc.filename}…`;
        setAttached(doc);
        setBusy(false);
        await waitUntilReady(doc.id, bubble);
      } catch (err) {
        showError(bubble, "Network error: " + err.message);
      } finally {
        setBusy(false);
      }
    }

    function addSources(sources) {
      if (!sources.length) return;
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const pages = [...new Set(sources.map((s) => s.page))].sort((a, b) => a - b);
      summary.textContent = `Sources: ${sources.length} chunks from page${pages.length > 1 ? "s" : ""} ${pages.join(", ")}`;
      details.appendChild(summary);
      for (const source of sources) {
        const block = document.createElement("div");
        block.className = "source";
        const heading = document.createElement("strong");
        heading.textContent = `Page ${source.page} · similarity ${source.score}`;
        block.append(heading, source.content);
        details.appendChild(block);
      }
      log.appendChild(details);
      log.scrollTop = log.scrollHeight;
    }

    // document attached: POST /ask/rag or /ask/prompt returns the whole answer at once
    async function askDocument(question) {
      addMessage(question, "user");
      const bubble = addMessage(method === "rag" ? "Searching and answering…" : "Reading the whole document…", "waiting");
      try {
        const res = await fetch(`/ask/${method}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ document_id: attached.id, question }),
        });
        if (!res.ok) {
          showError(bubble, await errorText(res));
          if (res.status === 404) setAttached(null);  // it's no longer in the database
          return;
        }
        const data = await res.json();
        bubble.className = "msg assistant";
        bubble.textContent = data.answer;
        addSources(data.sources);
        stats.textContent = `${data.method}: Total: ${data.latency_ms} ms · Input: ${data.input_tokens} tokens · Output: ${data.output_tokens} tokens`;
      } catch (err) {
        showError(bubble, "Network error: " + err.message);
      }
    }

    // no document: read the body piece by piece; each line is one JSON event
    async function sendMessage(message) {
      addMessage(message, "user");
      const bubble = addMessage("", "assistant");
      const start = performance.now();
      let firstMs = null;
      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });
        if (!res.ok) return showError(bubble, await errorText(res));

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();  // the last piece may be half a line; keep it for the next read

          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "delta") {
              if (firstMs === null) firstMs = Math.round(performance.now() - start);
              bubble.textContent += event.text;
              log.scrollTop = log.scrollHeight;
            } else if (event.type === "done") {
              conversationId = event.conversation_id;
              const totalMs = Math.round(performance.now() - start);
              stats.textContent = `First text: ${firstMs} ms · Total: ${totalMs} ms · Tokens: ${event.tokens_used}`;
            } else if (event.type === "error") {
              addMessage(event.detail, "error");
            }
          }
        }
      } catch (err) {
        addMessage("Network error: " + err.message, "error");
      }
    }

    async function send() {
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;
      if (attached && attached.status !== "ready") {
        addMessage("Still building chunks. Your question stays in the box, so try again in a moment.", "waiting");
        return;
      }
      input.value = "";
      setBusy(true);
      if (attached) await askDocument(message);
      else await sendMessage(message);
      setBusy(false);
      input.focus();
    }

    sendButton.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {  // Enter sends, Shift+Enter adds a new line
        e.preventDefault();
        send();
      }
    });

    attachButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadDocument(fileInput.files[0]);
      fileInput.value = "";  // so picking the same file again still fires "change"
    });

    document.getElementById("reset").addEventListener("click", () => {
      conversationId = null;
      log.innerHTML = "";
      stats.textContent = emptyStats();
    });

    renderMode();
    stats.textContent = emptyStats();
    checkAttached();
  </script>
</body>
</html>
