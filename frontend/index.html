<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaming Chat</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #262a33;
      --text: #e6e6e6;
      --muted: #8a8f98;
      --accent: #6ea8fe;
      --user: #2a3142;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; gap: 8px; padding: 12px 16px; }
    textarea {
      flex: 1; min-width: 0; resize: none; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit;
    }
    button {
      padding: 0 16px; border: 0; border-radius: 8px; font: inherit; cursor: pointer;
      background: var(--accent); color: #0f1115;
    }
    button.secondary { background: var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: wait; }
    main { padding: 0 16px 16px; }
    section {
      display: flex; flex-direction: column; height: calc(100vh - 90px);
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    }
    h2 { margin: 0; padding: 12px; font-size: 15px; border-bottom: 1px solid var(--border); }
    .stats { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; }
    .user { background: var(--user); }
    .error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <textarea id="input" rows="2" placeholder="Ask something, e.g. Explain how HTTPS works in 300 words"></textarea>
    <button id="send">Send</button>
    <button id="reset" class="secondary">New chat</button>
  </header>

  <main>
    <section>
      <h2>Streaming · POST /chat/stream</h2>
      <div class="stats" id="stats">First text: – · Total: – · Tokens: –</div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script>
    const EMPTY_STATS = "First text: – · Total: – · Tokens: –";
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const log = document.getElementById("log");
    const stats = document.getElementById("stats");

    let conversationId = null;  // null = the next message starts a new conversation

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;  // textContent, never innerHTML: model output can't inject HTML
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function showError(bubble, text) {
      bubble.textContent = text;
      bubble.classList.add("error");
    }

    async function errorText(res) {
      try { return (await res.json()).detail; } catch { return `HTTP ${res.status}`; }
    }

    // read the body piece by piece; each line is one JSON event
    async function sendMessage(message) {
      addMessage(message, "user");
      const bubble = addMessage("", "assistant");
      const start = performance.now();
      let firstMs = null;
      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });
        if (!res.ok) return showError(bubble, await errorText(res));

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();  // the last piece may be half a line; keep it for the next read

          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "delta") {
              if (firstMs === null) firstMs = Math.round(performance.now() - start);
              bubble.textContent += event.text;
              log.scrollTop = log.scrollHeight;
            } else if (event.type === "done") {
              conversationId = event.conversation_id;
              const totalMs = Math.round(performance.now() - start);
              stats.textContent = `First text: ${firstMs} ms · Total: ${totalMs} ms · Tokens: ${event.tokens_used}`;
            } else if (event.type === "error") {
              addMessage(event.detail, "error");
            }
          }
        }
      } catch (err) {
        addMessage("Network error: " + err.message, "error");
      }
    }

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      sendButton.disabled = true;
      await sendMessage(message);
      sendButton.disabled = false;
      input.focus();
    }

    sendButton.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {  // Enter sends, Shift+Enter adds a new line
        e.preventDefault();
        send();
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      conversationId = null;
      log.innerHTML = "";
      stats.textContent = EMPTY_STATS;
    });
  </script>
</body>
</html>
